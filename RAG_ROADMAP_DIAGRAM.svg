<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Gradually building a reliable RAG assistant</title>
  <desc id="desc">A flow diagram showing how to capture and categorize questions, route live readings to DaxView, route reference questions to approved RAG documents, evaluate answers, and roll out in stages.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8493aa" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2878df" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8064d8" />
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17243a; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
      .subtitle { font-size: 16px; fill: #64738a; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .card-title { font-size: 19px; font-weight: 700; }
      .body { font-size: 14px; fill: #52627a; }
      .small { font-size: 12px; fill: #64738a; }
      .number { font-size: 13px; font-weight: 700; }
      .phase-title { font-size: 14px; font-weight: 700; }
      .phase-body { font-size: 12px; fill: #64738a; }
    </style>
  </defs>

  <rect width="1600" height="1120" rx="24" fill="#f4f7fb" />
  <text x="72" y="76" class="eyebrow" fill="#2878df">AI SERVER · PRACTICAL ROADMAP</text>
  <text x="72" y="122" class="title">From chat logs to dependable RAG</text>
  <text x="72" y="153" class="subtitle">First understand each question. Then choose the right source, retrieve evidence, and measure answer quality.</text>

  <!-- Main intake flow -->
  <g>
    <rect x="72" y="205" width="300" height="150" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2" />
    <circle cx="108" cy="244" r="19" fill="#e9f1ff" />
    <text x="108" y="249" class="number" text-anchor="middle" fill="#2878df">01</text>
    <text x="140" y="249" class="card-title">Capture real turns</text>
    <text x="96" y="288" class="body">Question · answer · tool result</text>
    <text x="96" y="313" class="body">Feedback · failure reason</text>
    <text x="96" y="337" class="small">Keep private data access-controlled.</text>

    <rect x="430" y="205" width="360" height="150" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2" />
    <circle cx="466" cy="244" r="19" fill="#e9f1ff" />
    <text x="466" y="249" class="number" text-anchor="middle" fill="#2878df">02</text>
    <text x="498" y="249" class="card-title">Categorize each question</text>
    <text x="454" y="286" class="body">Domain · intent · metric · scope</text>
    <text x="454" y="310" class="body">Time range · source · outcome</text>
    <text x="454" y="336" class="small">Low confidence → human review.</text>

    <rect x="850" y="205" width="300" height="150" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2" />
    <circle cx="886" cy="244" r="19" fill="#e9f1ff" />
    <text x="886" y="249" class="number" text-anchor="middle" fill="#2878df">03</text>
    <text x="918" y="249" class="card-title">Choose a source</text>
    <text x="874" y="288" class="body">Live readings or reference</text>
    <text x="874" y="313" class="body">knowledge?</text>
    <text x="874" y="337" class="small">Use deterministic routing first.</text>

    <path d="M372 280 H418" fill="none" stroke="#8493aa" stroke-width="3" marker-end="url(#arrow)" />
    <path d="M790 280 H838" fill="none" stroke="#8493aa" stroke-width="3" marker-end="url(#arrow)" />
  </g>

  <!-- Two distinct source paths -->
  <path d="M1000 355 V396 H430 V425" fill="none" stroke="#2878df" stroke-width="3" marker-end="url(#arrowBlue)" />
  <path d="M1050 355 V396 H1165 V425" fill="none" stroke="#8064d8" stroke-width="3" marker-end="url(#arrowPurple)" />

  <g>
    <rect x="72" y="430" width="690" height="230" rx="20" fill="#edf5ff" stroke="#bfd8ff" stroke-width="2" />
    <rect x="96" y="454" width="117" height="24" rx="12" fill="#d8e9ff" />
    <text x="154" y="471" class="eyebrow" text-anchor="middle" fill="#246bc4">LIVE DATA</text>
    <text x="96" y="513" class="card-title">DaxView path</text>
    <text x="96" y="546" class="body">1. Resolve device, metric, scope, and dates</text>
    <text x="96" y="572" class="body">2. Authorize and fetch current readings</text>
    <text x="96" y="598" class="body">3. Calculate and summarize returned values</text>
    <text x="96" y="633" class="small">Never use an old chat answer as today’s reading.</text>
    <rect x="520" y="483" width="205" height="130" rx="16" fill="#ffffff" stroke="#d5e5fb" />
    <text x="622" y="520" class="card-title" text-anchor="middle" font-size="16">Grounded result</text>
    <text x="622" y="551" class="small" text-anchor="middle">Value + unit + period</text>
    <text x="622" y="575" class="small" text-anchor="middle">Device + source + caveat</text>
    <text x="622" y="599" class="small" text-anchor="middle">Table or chart if useful</text>

    <rect x="838" y="430" width="690" height="230" rx="20" fill="#f3f0ff" stroke="#d3c8ff" stroke-width="2" />
    <rect x="862" y="454" width="160" height="24" rx="12" fill="#e5ddff" />
    <text x="942" y="471" class="eyebrow" text-anchor="middle" fill="#7056c4">REFERENCE RAG</text>
    <text x="862" y="513" class="card-title">Knowledge path</text>
    <text x="862" y="546" class="body">1. Curate approved, current documents</text>
    <text x="862" y="572" class="body">2. Chunk by section and attach metadata</text>
    <text x="862" y="598" class="body">3. Retrieve relevant passages and cite them</text>
    <text x="862" y="633" class="small">Weak evidence → say so or ask; do not guess.</text>
    <rect x="1286" y="483" width="218" height="130" rx="16" fill="#ffffff" stroke="#e1dafb" />
    <text x="1395" y="520" class="card-title" text-anchor="middle" font-size="16">Curated sources</text>
    <text x="1395" y="551" class="small" text-anchor="middle">Manuals · procedures</text>
    <text x="1395" y="575" class="small" text-anchor="middle">Standards · definitions</text>
    <text x="1395" y="599" class="small" text-anchor="middle">Version · owner · access</text>
  </g>

  <!-- Evidence and learning loop -->
  <path d="M418 660 V704 H610 V735" fill="none" stroke="#2878df" stroke-width="3" marker-end="url(#arrowBlue)" />
  <path d="M1182 660 V704 H990 V735" fill="none" stroke="#8064d8" stroke-width="3" marker-end="url(#arrowPurple)" />
  <rect x="380" y="740" width="840" height="94" rx="20" fill="#17243a" />
  <text x="800" y="780" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Answer from evidence and save what happened</text>
  <text x="800" y="809" text-anchor="middle" fill="#c6d2e2" font-size="14">Store labels · selected tool · source IDs · outcome · reviewer feedback</text>

  <path d="M800 834 V870" fill="none" stroke="#8493aa" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="300" y="878" width="1000" height="84" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2" />
  <text x="800" y="913" text-anchor="middle" class="card-title">Evaluate by intent before expanding</text>
  <text x="800" y="941" text-anchor="middle" class="body">Routing accuracy · retrieval quality · grounded answers · latency · failure rate</text>

  <!-- Gradual rollout -->
  <text x="72" y="1002" class="eyebrow" fill="#64738a">ROLL OUT IN SMALL, MEASURABLE STEPS</text>
  <g>
    <rect x="72" y="1020" width="272" height="72" rx="14" fill="#e8f0fb" />
    <text x="92" y="1048" class="phase-title">1 · Categorize</text>
    <text x="92" y="1073" class="phase-body">Taxonomy + reviewed sample</text>

    <rect x="366" y="1020" width="272" height="72" rx="14" fill="#e8f0fb" />
    <text x="386" y="1048" class="phase-title">2 · Curate</text>
    <text x="386" y="1073" class="phase-body">Sources + metadata + versions</text>

    <rect x="660" y="1020" width="272" height="72" rx="14" fill="#eee9ff" />
    <text x="680" y="1048" class="phase-title">3 · Retrieve</text>
    <text x="680" y="1073" class="phase-body">Knowledge-only RAG + citations</text>

    <rect x="954" y="1020" width="272" height="72" rx="14" fill="#e5f5ef" />
    <text x="974" y="1048" class="phase-title">4 · Evaluate</text>
    <text x="974" y="1073" class="phase-body">Gold questions + shadow runs</text>

    <rect x="1248" y="1020" width="280" height="72" rx="14" fill="#e5f5ef" />
    <text x="1268" y="1048" class="phase-title">5 · Expand</text>
    <text x="1268" y="1073" class="phase-body">Enable only proven intents</text>
  </g>
</svg>
